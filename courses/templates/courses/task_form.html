{% extends "courses/base.html" %}

{% block title %}
    Add Task
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4">
                    Add Task
                </h2>


                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}


                    <div class="mt-3">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Task
                        </button>

                        <a
                            href="{% url 'courses:course_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
