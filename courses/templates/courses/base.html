{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Course Tracker
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{% static 'courses/css/style.css' %}"
    >
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a
                class="navbar-brand"
                href="{% url 'courses:dashboard' %}"
            >
                Course Tracker
            </a>

            <div>
                <a
                    href="{% url 'courses:dashboard' %}"
                    class="btn btn-outline-light btn-sm"
                >
                    Dashboard
                </a>

                <a
                    href="{% url 'courses:course_list' %}"
                    class="btn btn-outline-light btn-sm"
                >
                    Courses
                </a>

                <a
                    href="{% url 'courses:course_create' %}"
                    class="btn btn-primary btn-sm"
                >
                    + Add Course
                </a>
            </div>

        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-4">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom JavaScript -->
    <script src="{% static 'courses/js/app.js' %}"></script>

</body>
</html>
