{% extends "courses/base.html" %}

{% block title %}
    Delete Course | {{ course.title }}
{% endblock %}

{% block content %}

<div class="row justify-content-center py-4">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm border-0">

            <div class="card-body text-center p-4">

                <div class="text-danger mb-3">
                    <i class="bi bi-exclamation-triangle-fill display-4"></i>
                </div>

                <h3 class="h4 fw-bold text-dark mb-2">
                    Delete Course?
                </h3>

                <p class="text-muted mb-3">
                    Are you sure you want to delete:
                    <strong class="text-dark d-block mt-1 fs-5">"{{ course.title }}"</strong>
                </p>

                <div class="alert alert-warning small py-2 mb-4">
                    <i class="bi bi-info-circle me-1"></i> This will permanently remove all tasks belonging to this course.
                </div>


                <form method="POST">

                    {% csrf_token %}

                    <div class="d-flex justify-content-center gap-2">
                        <button
                            type="submit"
                            class="btn btn-danger rounded-pill px-4"
                        >
                            <i class="bi bi-trash me-1"></i> Yes, Delete
                        </button>

                        <a
                            href="{% url 'courses:course_detail' course.pk %}"
                            class="btn btn-outline-secondary rounded-pill px-4"
                        >
                            Cancel
                        </a>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
