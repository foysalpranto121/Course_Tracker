{% extends "courses/base.html" %}

{% block title %}
    Delete Course
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-body text-center">

                <h3>
                    Delete Course?
                </h3>

                <p class="text-muted mt-3">

                    Are you sure you want to delete:

                    <strong>
                        {{ course.title }}
                    </strong>?

                </p>

                <p class="text-danger">
                    This will also delete all tasks belonging to this course.
                </p>


                <form method="POST">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Yes, Delete
                    </button>

                    <a
                        href="{% url 'courses:course_detail' course.pk %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
